# Two API instances sharing one snapshot through Redis.
x-api: &api
  build: .
  environment:
    Cache__Provider: Redis
    ConnectionStrings__Redis: redis:6379
  depends_on:
    - redis

services:
  redis:
    image: redis:7-alpine

  api-1:
    <<: *api
    ports:
      - "8081:8080"

  api-2:
    <<: *api
    ports:
      - "8082:8080"
